<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gedichtgenerator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>"
    />
    <style>
      :root {
        --bg1: #ffd6e8;
        --bg2: #ffeef6;
        --paper: #fffafc;
        --ink: #4a1d36;
        --rule: #f8c4da;
        --margin: #ee7fb0;
        --accent: #e0136f;
        --accent-ink: #ffffff;
        --muted: #a0668483;
        --muted: #9a5d7a;
        --shadow: rgba(190, 40, 110, 0.3);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg1: #3a1230;
          --bg2: #1f0c1b;
          --paper: #3a2234;
          --ink: #ffe8f3;
          --rule: #5a3652;
          --margin: #b04a82;
          --accent: #ff4fa3;
          --accent-ink: #2a0b1d;
          --muted: #d49bb9;
          --shadow: rgba(0, 0, 0, 0.55);
        }
      }
      :root[data-theme="dark"] {
        --bg1: #3a1230;
        --bg2: #1f0c1b;
        --paper: #3a2234;
        --ink: #ffe8f3;
        --rule: #5a3652;
        --margin: #b04a82;
        --accent: #ff4fa3;
        --accent-ink: #2a0b1d;
        --muted: #d49bb9;
        --shadow: rgba(0, 0, 0, 0.55);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2rem 1.25rem;
        background: var(--bg2)
          radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 75%) fixed;
        color: var(--ink);
        font-family:
          "Bricolage Grotesque",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        overflow-x: hidden;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 3.6rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: center;
        background: linear-gradient(
          100deg,
          #ff2d8a 0%,
          #ff8fc4 35%,
          #c2186f 70%,
          #ff5fa8 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      .paper {
        width: min(100%, 26rem);
        min-height: 13.2rem;
        padding: 2.2rem 1.5rem 1.1rem 4rem;
        background-color: var(--paper);
        background-image:
          linear-gradient(
            to right,
            transparent 3rem,
            var(--margin) 3rem,
            var(--margin) calc(3rem + 2px),
            transparent calc(3rem + 2px)
          ),
          repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent calc(2.2rem - 2px),
            var(--rule) calc(2.2rem - 2px),
            var(--rule) 2.2rem
          );
        background-position:
          0 0,
          0 2.2rem;
        border-radius: 4px;
        box-shadow: 0 18px 30px -12px var(--shadow);
        transform: rotate(-1.2deg);
      }
      #line {
        margin: 0;
        font-family: "Caveat", "Segoe Script", "Bradley Hand", cursive;
        font-size: 1.9rem;
        font-weight: 700;
        line-height: 2.2rem;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      #line.empty {
        color: var(--muted);
        font-weight: 500;
      }
      button {
        position: relative;
        font: inherit;
        font-size: 1.15rem;
        font-weight: 700;
        padding: 0.8rem 1.8rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--accent) 80%, white),
          var(--accent)
        );
        color: var(--accent-ink);
        cursor: pointer;
        box-shadow: 0 6px 0 rgba(90, 10, 50, 0.35);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 rgba(90, 10, 50, 0.35);
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }

      /* Teilen */
      body {
        padding-top: 4.5rem;
      }
      .share {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
        right: 0.75rem;
        z-index: 900;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.55rem 1rem;
        font-size: 1rem;
        background: var(--paper);
        color: var(--accent);
        border: 2px solid var(--accent);
        box-shadow: 0 4px 0 rgba(90, 10, 50, 0.25);
      }
      .share svg {
        width: 1.1em;
        height: 1.1em;
      }
      .share:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
        z-index: 1100;
        max-width: calc(100% - 2rem);
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-weight: 700;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 1rem);
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* Glitzerspur */
      .sparkle {
        position: fixed;
        z-index: 1000;
        pointer-events: none;
        line-height: 1;
        transform: translate(-50%, -50%);
        text-shadow: 0 0 6px currentColor;
        animation: sparkle 0.9s ease-out forwards;
      }
      @keyframes sparkle {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
        }
        30% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.1) rotate(60deg);
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
            scale(0.2) rotate(180deg);
        }
      }

      /* Herzen */
      .heart {
        position: fixed;
        z-index: 1000;
        pointer-events: none;
        line-height: 1;
        transform: translate(-50%, -50%);
        animation: heart 1.2s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }
      @keyframes heart {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty)))
            scale(1) rotate(var(--rot));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
        .sparkle,
        .heart {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Gedichtgenerator</h1>
    <div class="paper">
      <p id="line" class="empty" aria-live="polite">Drück auf den Knopf …</p>
    </div>
    <button id="button">Neues Gedicht ♥</button>

    <button id="share" class="share" disabled aria-label="Gedicht teilen">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 15V3" />
        <path d="M7.5 7.5 12 3l4.5 4.5" />
        <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
      </svg>
      Teilen
    </button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      const firstLineTokens = [
        [
          "Take me to",
          "I’ve come too far to watch",
          "I want",
          "I got cursed like",
          "No sign of",
          "They want",
          "I made wishes to",
          "You remind me of",
          "I protect",
          "I can make",
          "I hate",
          "I dream of",
          "I choose",
        ],
        [
          "the lakes where all the poets went to die",
          "a basketball hoop",
          "you right here",
          "an Oscar on the bathroom floor",
          "soulmates",
          "that complex female character",
          "those three dogs that they call their kids",
          "a younger me",
          "the family",
          "deals with the devil, because my dick’s bigger",
          "you",
          "your love",
          "you and me",
        ],
      ];

      const secondLineTokens = [
        [
          "I didn’t have it in myself to",
          "You know I didn’t want to",
          "You had to kill me, but I",
          "Cursing my name, wishing I’d",
          "I just want to",
          "I just ",
        ],
        [
          "go with grace",
          "have to haunt you",
          "kill you just the same",
          "stay",
          "stay in that lavender haze",
          "need you",
        ],
      ];

      const thirdLineTokens = [
        ["There is", "Don’t blame", "My name is", "Every single hot take is"],
        ["trouble", "me", "whatever", "cold"],
        ["in paradise", "now", "you decide", "now"],
      ];

      /* --------------------------- Gedicht --------------------------- */
      /* Wo die Zufallszahlen in der URL stehen:
         "hash"  -> #g-0-2-1-...  (funktioniert auch auf der gehosteten Artifact-Seite)
         "query" -> ?g=0-2-1-...  (für eigenes Hosting, z. B. GitHub Pages) */
      const STATE_IN = "hash";

      const lineSets = [firstLineTokens, secondLineTokens, thirdLineTokens];
      const allGroups = lineSets.flat();
      const lineEl = document.getElementById("line");
      const shareBtn = document.getElementById("share");
      const toastEl = document.getElementById("toast");

      document.getElementById("button").addEventListener("click", displayPoem);
      shareBtn.addEventListener("click", sharePoem);
      window.addEventListener("hashchange", showFromUrl);

      // Eine Zufallszahl pro Token-Gruppe, in der Reihenfolge aller Gruppen.
      function randomIndices() {
        return allGroups.map((group) =>
          Math.floor(Math.random() * group.length),
        );
      }

      function poemFromIndices(indices) {
        let k = 0;
        return lineSets
          .map((set) => set.map((group) => group[indices[k++]]).join(" "))
          .join("\n");
      }

      function readIndices() {
        let code = "";
        if (STATE_IN === "query") {
          code = new URLSearchParams(location.search).get("g") || "";
        } else if (location.hash.startsWith("#g-")) {
          code = location.hash.slice(3);
        }
        if (!code) return null;
        const parts = code.split("-").map(Number);
        const valid =
          parts.length === allGroups.length &&
          parts.every(
            (n, i) => Number.isInteger(n) && n >= 0 && n < allGroups[i].length,
          );
        return valid ? parts : null;
      }

      function writeIndices(indices) {
        const code = indices.join("-");
        if (STATE_IN === "query") {
          const url = new URL(location.href);
          url.searchParams.set("g", code);
          history.replaceState(null, "", url);
        } else {
          location.hash = "g-" + code;
        }
      }

      function showPoem(indices) {
        lineEl.classList.remove("empty");
        lineEl.textContent = poemFromIndices(indices);
        shareBtn.disabled = false;
      }

      function showFromUrl() {
        const indices = readIndices();
        if (indices) showPoem(indices);
      }

      function displayPoem(event) {
        const indices = randomIndices();
        showPoem(indices);
        writeIndices(indices);
        sprayHearts(event.currentTarget);
      }

      /* --------------------------- Teilen ---------------------------- */
      let toastTimer;
      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch (err) {
            ok = false;
          }
          ta.remove();
          return ok;
        }
      }

      async function sharePoem() {
        const url = location.href;
        const isTouch = window.matchMedia("(pointer: coarse)").matches;
        // Auf dem Handy: das Teilen-Menü des Betriebssystems.
        if (isTouch && navigator.share) {
          try {
            await navigator.share({ title: "Gedichtgenerator", url });
            return;
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }
        // Sonst (oder als Fallback): Link kopieren.
        const ok = await copyText(url);
        toast(
          ok
            ? "Link kopiert ♥"
            : "Kopieren nicht möglich – bitte die Adresszeile nutzen",
        );
      }

      // Beim Laden: Gedicht aus der URL anzeigen, falls vorhanden.
      showFromUrl();

      /* ------------------------- Effekte --------------------------- */
      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );
      const glitterColors = [
        "#ff2d8a",
        "#ff8fc4",
        "#ffd166",
        "#ffffff",
        "#ff5fa8",
        "#f7b6ff",
      ];
      const sparkleShapes = ["✦", "✧", "★", "✨"];
      const heartShapes = ["♥", "💖", "💗", "💕"];
      const rand = (min, max) => min + Math.random() * (max - min);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      function spawn(el) {
        document.body.appendChild(el);
        el.addEventListener("animationend", () => el.remove());
      }

      let lastSparkle = 0;
      window.addEventListener("pointermove", (e) => {
        if (reduceMotion.matches) return;
        const now = performance.now();
        if (now - lastSparkle < 28) return;
        lastSparkle = now;
        const s = document.createElement("span");
        s.className = "sparkle";
        s.textContent = pick(sparkleShapes);
        s.style.left = e.clientX + rand(-6, 6) + "px";
        s.style.top = e.clientY + rand(-6, 6) + "px";
        s.style.fontSize = rand(10, 22) + "px";
        s.style.color = pick(glitterColors);
        s.style.setProperty("--dx", rand(-18, 18) + "px");
        s.style.setProperty("--dy", rand(10, 40) + "px");
        spawn(s);
      });

      function sprayHearts(button) {
        if (reduceMotion.matches) return;
        const rect = button.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        for (let i = 0; i < 22; i++) {
          const h = document.createElement("span");
          h.className = "heart";
          h.textContent = pick(heartShapes);
          const angle = rand(-165, -15) * (Math.PI / 180);
          const dist = rand(90, 240);
          h.style.left = cx + rand(-rect.width / 3, rect.width / 3) + "px";
          h.style.top = cy + "px";
          h.style.fontSize = rand(16, 34) + "px";
          h.style.color = pick(["#ff2d8a", "#ff5fa8", "#ff8fc4", "#e0136f"]);
          h.style.setProperty("--tx", Math.cos(angle) * dist + "px");
          h.style.setProperty("--ty", Math.sin(angle) * dist + "px");
          h.style.setProperty("--rot", rand(-40, 40) + "deg");
          h.style.animationDelay = rand(0, 0.15) + "s";
          spawn(h);
        }
      }
    </script>
  </body>
</html>
