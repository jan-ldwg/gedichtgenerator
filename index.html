<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gedichtgenerator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>"
    />
    <style>
      :root {
        --bg: #e4ecd2;
        --paper: #fffdf6;
        --ink: #2b2a26;
        --rule: #b9d3e6;
        --margin: #e9a09a;
        --accent: #d63f2b;
        --accent-ink: #fffdf6;
        --muted: #6b7060;
        --shadow: rgba(60, 70, 30, 0.22);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1d2418;
          --paper: #2a2d24;
          --ink: #f1ecdc;
          --rule: #3d4a56;
          --margin: #8a4a46;
          --accent: #ef6a54;
          --accent-ink: #1d1a14;
          --muted: #a4a995;
          --shadow: rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme="dark"] {
        --bg: #1d2418;
        --paper: #2a2d24;
        --ink: #f1ecdc;
        --rule: #3d4a56;
        --margin: #8a4a46;
        --accent: #ef6a54;
        --accent-ink: #1d1a14;
        --muted: #a4a995;
        --shadow: rgba(0, 0, 0, 0.5);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2rem 1.25rem;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Bricolage Grotesque",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 3.6rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .paper {
        width: min(100%, 26rem);
        min-height: 13.2rem;
        padding: 2.2rem 1.5rem 1.1rem 4rem;
        background-color: var(--paper);
        background-image:
          linear-gradient(
            to right,
            transparent 3rem,
            var(--margin) 3rem,
            var(--margin) calc(3rem + 2px),
            transparent calc(3rem + 2px)
          ),
          repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent calc(2.2rem - 2px),
            var(--rule) calc(2.2rem - 2px),
            var(--rule) 2.2rem
          );
        background-position:
          0 0,
          0 2.2rem;
        border-radius: 4px;
        box-shadow: 0 18px 30px -12px var(--shadow);
        transform: rotate(-1.2deg);
      }
      #line {
        margin: 0;
        font-family: "Caveat", "Segoe Script", "Bradley Hand", cursive;
        font-size: 1.9rem;
        font-weight: 700;
        line-height: 2.2rem;
        white-space: pre-line; /* macht aus \n echte Zeilenumbrüche */
        overflow-wrap: anywhere;
      }
      #line.empty {
        color: var(--muted);
        font-weight: 500;
      }
      button {
        font: inherit;
        font-size: 1.15rem;
        font-weight: 700;
        padding: 0.8rem 1.8rem;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.22);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Gedichtgenerator</h1>
    <div class="paper">
      <p id="line" class="empty" aria-live="polite">Drück auf den Knopf …</p>
    </div>
    <button id="button">Neues Gedicht</button>

    <script>
      const tokens = [
        ["Ich liebe", "Ich hasse", "Ich mag nicht"],
        ["Tunfisch", "Tomaten", "Gurken"],
      ];

      document.getElementById("button").addEventListener("click", displayPoem);

      function generateLine() {
        const x = Math.floor(Math.random() * tokens[0].length);
        const y = Math.floor(Math.random() * tokens[1].length);
        const elements = [tokens[0][x], tokens[1][y]];
        return elements.join(" ");
      }

      function generatePoem(lineCount) {
        let result = [];
        for (let i = 0; i < lineCount; i++) {
          result.push(generateLine());
        }
        return result.join("\n");
      }

      function displayPoem() {
        const line = document.getElementById("line");
        line.classList.remove("empty");
        line.textContent = generatePoem(3);
      }
    </script>
  </body>
</html>
